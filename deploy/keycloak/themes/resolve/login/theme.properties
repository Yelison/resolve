# Tema de inicio de sesión de Resolve. Hereda de keycloak.v2 (el tema por defecto de Keycloak 26) y solo añade CSS y un
# script pequeño: no sobrescribe ninguna plantilla FreeMarker, así que `#username`, `#password`, `#kc-login` y
# `#kc-form-login` siguen siendo los de Keycloak y las plantillas se actualizan con él.
parent=keycloak.v2

# `styles` sustituye a la lista del padre: se repite su hoja para conservar el maquetado base de PatternFly.
# tokens.css es una copia literal de frontend/src/styles/tokens.css (la vigila tokens.keycloak.test.ts).
styles=css/styles.css css/tokens.css css/resolve.css
scripts=js/resolve.js

# El modo oscuro lo decide prefers-color-scheme en resolve.css (igual que tokens.css); se desactiva el interruptor de
# PatternFly para que no haya dos mecanismos.
darkMode=false
