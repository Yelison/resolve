spring.application.name=resolve-api

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Sin context-path: el prefijo /api lo añade ApiPathPrefix a los controladores, y así la aplicación web puede servirse
# desde la raíz del mismo origen. La salud de actuator se queda bajo /api (ver management.endpoints.web.base-path).
spring.web.error.include-stacktrace=never
# El BasicErrorController también cuelga de /api (como cuando era el context-path): el acceso directo de un anónimo es
# un 401 Problem y /error vuelve a ser una ruta de la aplicación web. Las redirecciones ERROR del contenedor siguen
# permitidas.
spring.web.error.path=/api/error
spring.mvc.problemdetails.enabled=true
# La aplicación web (frontend/dist, copiado en static/ al empaquetar) la sirve SpaResources; el manejador de /** de Spring
# Boot se desactiva para que no compita con él. resolve.web.location cambia dónde se busca (por defecto classpath:/static/).
spring.web.resources.add-mappings=false
# El contrato declara additionalProperties: false en todos los cuerpos: un campo desconocido es un 400.
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/api/actuator

# Cookie de sesión: HttpOnly y SameSite=Lax en todos los perfiles (en dev solo existe si se elige organización). El perfil
# oidc añade Secure. El Path es /api, como cuando era el context-path: los recursos de la aplicación web no la llevan y
# el cierre de sesión la borra con este mismo valor.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api

#---
spring.config.activate.on-profile=!prod
# Los comentarios van después de cada separador: uno justo antes de «#---» puede hacer que Spring Boot no parta el
# archivo en documentos y las condiciones de perfil dejen de aplicarse (lo vigila ProfileConfigurationTest).
# Valores por defecto de desarrollo y pruebas: la base de datos local de docker-compose. En el perfil prod no existe
# ninguno (ver application-prod.properties): sin su variable, el arranque falla nombrándola.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/resolve}
spring.datasource.username=${DATABASE_USERNAME:resolve}
spring.datasource.password=${DATABASE_PASSWORD:resolve}
#---
spring.config.activate.on-profile=oidc & !prod
# Perfil oidc fuera de prod: los valores por defecto son los del realm local de docker-compose (solo desarrollo; el
# secreto es el de ese realm y se sobrescribe con RESOLVE_OIDC_CLIENT_SECRET en cualquier otro entorno). Viven aquí y
# no en application-oidc.properties porque un archivo de perfil pesa más que uno sin perfil: con «prod,oidc» sus valores
# por defecto taparían los obligatorios de prod.
spring.security.oauth2.client.provider.resolve.issuer-uri=${RESOLVE_OIDC_ISSUER:http://localhost:8180/realms/resolve}
spring.security.oauth2.client.registration.resolve.client-id=${RESOLVE_OIDC_CLIENT_ID:resolve-api}
spring.security.oauth2.client.registration.resolve.client-secret=${RESOLVE_OIDC_CLIENT_SECRET:resolve-dev-secret}
resolve.public-url=${RESOLVE_PUBLIC_URL:http://localhost:5173}
# Cookie de sesión y XSRF-TOKEN con Secure por defecto. Solo se baja a false para probar con navegadores que no traten
# localhost como contexto seguro.
server.servlet.session.cookie.secure=${RESOLVE_SESSION_COOKIE_SECURE:true}
#---
spring.config.activate.on-profile=oidc & prod
# Perfil oidc en prod: ni un valor por defecto. Una variable ausente es un error de arranque que la nombra.
spring.security.oauth2.client.provider.resolve.issuer-uri=${RESOLVE_OIDC_ISSUER}
spring.security.oauth2.client.registration.resolve.client-id=${RESOLVE_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.resolve.client-secret=${RESOLVE_OIDC_CLIENT_SECRET}
resolve.public-url=${RESOLVE_PUBLIC_URL}
