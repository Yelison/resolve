# Solo desarrollo: datos de demostración y usuario por defecto para la autenticación de demostración.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
resolve.demo.default-user=yelisson.ortiz@acme.example
# Las migraciones de demostración usan versiones 1000+; las nuevas migraciones reales (V2, V3…) llegan después en
# una base de desarrollo existente, así que en dev se aplican aunque su versión sea menor.
spring.flyway.out-of-order=true
