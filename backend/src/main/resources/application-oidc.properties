# Perfil oidc: el backend es el BFF de OpenID Connect. El navegador entra por /api/oauth2/authorization/resolve, los
# tokens se quedan en el servidor y la API responde con una cookie de sesión. Se combina con otro perfil:
#   SPRING_PROFILES_ACTIVE=dev,oidc   (datos de demostración con Keycloak local, ver el README)
#   SPRING_PROFILES_ACTIVE=oidc       (datos reales)
# Con oidc el login de demostración (X-Demo-User) deja de existir aunque dev esté activo.

# Proveedor de identidad. Los valores por defecto son los del realm local de docker-compose (solo desarrollo): el
# secreto es el de ese realm y se sobrescribe con RESOLVE_OIDC_CLIENT_SECRET en cualquier otro entorno.
spring.security.oauth2.client.provider.resolve.issuer-uri=${RESOLVE_OIDC_ISSUER:http://localhost:8180/realms/resolve}
spring.security.oauth2.client.registration.resolve.provider=resolve
spring.security.oauth2.client.registration.resolve.client-id=${RESOLVE_OIDC_CLIENT_ID:resolve-api}
spring.security.oauth2.client.registration.resolve.client-secret=${RESOLVE_OIDC_CLIENT_SECRET:resolve-dev-secret}
spring.security.oauth2.client.registration.resolve.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.resolve.scope=openid,profile,email
spring.security.oauth2.client.registration.resolve.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}

# Adónde vuelve el navegador tras entrar (la aplicación web) y adónde va si el proveedor rechaza el acceso.
resolve.public-url=${RESOLVE_PUBLIC_URL:http://localhost:5173}

# Cookie de sesión: HttpOnly y SameSite=Lax vienen de application.properties; Secure por defecto aquí. Solo se baja a
# false para probar con navegadores que no traten localhost como contexto seguro.
server.servlet.session.cookie.secure=${RESOLVE_SESSION_COOKIE_SECURE:true}
