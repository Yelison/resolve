# Perfil de producción. Ningún valor de conexión ni de identidad tiene valor por defecto: una variable ausente impide
# el arranque con «Could not resolve placeholder '<VARIABLE>'». Las de OIDC (RESOLVE_OIDC_ISSUER,
# RESOLVE_OIDC_CLIENT_ID, RESOLVE_OIDC_CLIENT_SECRET y RESOLVE_PUBLIC_URL) se exigen en application.properties cuando
# se combina con el perfil oidc: SPRING_PROFILES_ACTIVE=prod,oidc. Ver docs/deploy/README.md.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Solo las migraciones reales: los datos de demostración (db/demo) son de dev. SPRING_FLYWAY_LOCATIONS las cambia en
# una demostración pública.
spring.flyway.locations=classpath:db/migration

# Detrás del proxy de la plataforma: X-Forwarded-* decide el esquema y el host (HTTPS, redirect-uri de OIDC, HSTS).
server.forward-headers-strategy=framework

# La cookie de sesión siempre Secure (también la XSRF-TOKEN, que toma este valor). Ninguna variable de Resolve la baja;
# la de Spring SERVER_SERVLET_SESSION_COOKIE_SECURE sí (el entorno pesa más que este archivo): no se define en prod.
server.servlet.session.cookie.secure=true

# Nunca una traza en una respuesta de error.
spring.web.error.include-stacktrace=never

# Sondas de liveness y readiness (/api/actuator/health/liveness y /readiness).
management.endpoint.health.probes.enabled=true

# Registros en JSON con el formato de Elastic Common Schema.
logging.structured.format.console=ecs
