version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Los tipos de Node siguen la versión de runtime fijada en .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
