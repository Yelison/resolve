version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Los tipos de Node siguen la versión de runtime fijada en .nvmrc (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7.0 no trae la API programática (llega distinta en la 7.1), y la usan openapi-typescript (peer ^5.x;
      # `npm run api:types` lo exige la CI) y scripts/check-query-keys.mjs. Reabrir cuando openapi-typescript publique
      # soporte: https://github.com/openapi-ts/openapi-typescript/issues/2841 (diagnóstico en #5).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      frontend:
        patterns: ['*']
        update-types: [minor, patch]
        # @yelison/forma-ui lleva los tokens y, desde la 5.2b, los componentes: nunca viaja en el grupo general.
        exclude-patterns: ['@yelison/forma-ui']
      # Solo sus parches, en su propio PR: `dependabot-automerge.yml` los autofunde cuando pasan los checks obligatorios.
      # Sus minor y major quedan fuera de todo grupo (un PR por versión) y los revisa siempre el propietario, porque un
      # cambio visual necesita ojos aunque pasen los checks. Reglas en docs/development/dependencies.md.
      forma-ui:
        patterns: ['@yelison/forma-ui']
        update-types: [patch]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Fly.io está descartado (la demo es estática en GitHub Pages); deploy.yml sigue inactivo sin DEPLOY_ENABLED.
      - dependency-name: 'superfly/flyctl-actions/*'
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/keycloak
    schedule:
      interval: weekly
    ignore:
      # Node sigue a .nvmrc (22, LTS) y Java a Temurin 25 (LTS): un salto de major se decide aparte, nunca por Dependabot.
      # La imagen de Maven lleva el JDK en el sufijo de la etiqueta (3.10-eclipse-temurin-25), así que su salto de JDK no es
      # un major de Maven: esos PR se cierran a mano y Dependabot no vuelve a proponer esa versión.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
