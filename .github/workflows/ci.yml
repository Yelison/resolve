name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint, types, coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match docs/api/openapi.yaml
        run: npm run api:types && git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: Frontend - Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  smoke:
    name: Full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resolve
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve # solo para esta base efímera del job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve -d resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the API
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      # El perfil `dev` siembra los datos de demostración y acepta X-Demo-User; el build `smoke` del frontend lo envía.
      - name: Start the API with the dev profile
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_URL: jdbc:postgresql://localhost:5432/resolve
        run: nohup java -jar target/*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Wait for the API
        run: curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/api/actuator/health
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Smoke suite against the real API
        working-directory: frontend
        env:
          SMOKE: '1'
        run: npx playwright test --project=smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-traces-and-api-log
          path: |
            frontend/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7

  backend:
    name: Backend - build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  backend-windows:
    name: Backend - Maven wrapper on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Los tests usan contenedores Linux, que los runners de Windows no ofrecen; aquí se valida
      # que mvnw.cmd arranca Maven y compila el proyecto.
      - run: mvnw.cmd -B -DskipTests package
