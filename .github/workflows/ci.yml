name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint, types, coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match docs/api/openapi.yaml
        run: npm run api:types && git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: Frontend - Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  smoke:
    name: Full-stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: resolve
          POSTGRES_USER: resolve
          POSTGRES_PASSWORD: resolve # solo para esta base efímera del job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolve -d resolve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the API
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      # El perfil `dev` siembra los datos de demostración y acepta X-Demo-User; el build `smoke` del frontend lo envía.
      - name: Start the API with the dev profile
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_URL: jdbc:postgresql://localhost:5432/resolve
        run: nohup java -jar target/*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Wait for the API
        timeout-minutes: 3
        run: >-
          curl -fsS --max-time 5 --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors
          http://localhost:8080/api/actuator/health
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Smoke suite against the real API
        working-directory: frontend
        timeout-minutes: 10
        env:
          SMOKE: '1'
        run: npx playwright test --project=smoke
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: smoke-traces-and-api-log
          path: |
            frontend/test-results
            ${{ runner.temp }}/backend.log
          retention-days: 7

  backend:
    name: Backend - build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  backend-windows:
    name: Backend - Maven wrapper on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Los tests usan contenedores Linux, que los runners de Windows no ofrecen; aquí se valida
      # que mvnw.cmd arranca Maven y compila el proyecto.
      - run: mvnw.cmd -B -DskipTests package

  # Opcional: no figura entre los checks obligatorios. Sirve la aplicación desde el jar (mismo origen, como en
  # producción) con los perfiles `dev,oidc` y entra por un Keycloak real con el realm de deploy/keycloak. Los valores
  # por defecto (API en 8080, Keycloak en 8180, PostgreSQL en 5432) ya son los que el realm acepta como redirección.
  auth-e2e:
    name: Authentication e2e (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # El realm se monta desde el repositorio, así que no puede ser un contenedor de servicio (arrancan antes del
      # checkout y no admiten `start-dev --import-realm`). `--wait` espera a los healthchecks de docker-compose.yml.
      - name: Start PostgreSQL and Keycloak
        run: docker compose up -d --wait postgres keycloak
      - run: npm ci
        working-directory: frontend
      - name: Build the frontend (production mode, without the demo login)
        working-directory: frontend
        run: npm run build
      - name: Package the API with the frontend inside
        run: |
          mkdir -p backend/target/classes/static
          cp -r frontend/dist/. backend/target/classes/static/
          cd backend && ./mvnw -B -DskipTests package
      - name: Start the API with the dev and oidc profiles
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev,oidc
          RESOLVE_PUBLIC_URL: http://localhost:8080
        run: nohup java -jar target/*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Wait for the API and Keycloak
        timeout-minutes: 3
        run: >-
          curl -fsS --max-time 5 --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors
          http://localhost:8080/api/actuator/health &&
          curl -fsS --max-time 5 --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors
          http://localhost:8180/realms/resolve/.well-known/openid-configuration
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # e2e-auth/ no está en tsconfig.e2e.json (que cubre `npm run typecheck`): tiene su propio tsconfig.
      - name: Type-check the authentication scenarios
        working-directory: frontend
        run: npx tsc -p e2e-auth/tsconfig.json
      - name: Authentication scenarios against Keycloak
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:auth -- --workers=1
      - name: Keep the Keycloak log
        if: failure() || cancelled()
        run: docker compose logs --no-color keycloak > "$RUNNER_TEMP/keycloak.log" 2>&1
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: auth-e2e-traces-and-logs
          path: |
            frontend/test-results
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/keycloak.log
          retention-days: 7
