name: Deploy

# Publica la imagen y la despliega cuando la CI de `main` termina bien. Nada corre mientras el propietario no cree la
# variable de repositorio DEPLOY_ENABLED=true (docs/deploy/README.md): sin cuentas de Fly ni de Neon, los jobs se omiten.
#
# Se usa workflow_run y no un job `needs` dentro de ci.yml: así este flujo no toca ci.yml (que tiene otros dueños), la CI
# de los pull requests nunca despliega, y el SHA desplegado es exactamente el que la CI comprobó (head_sha).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# Un despliegue a la vez y ninguno se cancela a medias: el siguiente espera.
# Comparte grupo con demo-reset.yml: un despliegue (cuya máquina nueva ejecuta Flyway al arrancar) no se solapa con el
# `flyway clean` + `migrate` del reinicio nocturno. GitHub deja una sola ejecución pendiente por grupo: si llegan varias, se
# conserva la más reciente, que es la que interesa desplegar.
concurrency:
  group: demo-deploy-and-reset
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish the image
    if: vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Image name (GHCR requires lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    needs: image
    # El mismo control que `image`, propio y no heredado de `needs`: un cambio futuro (`if: always()`, quitar `needs`) no
    # puede desplegar sin la variable ni con una CI que falló.
    if: vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Deploy the image tagged with the SHA
        run: flyctl deploy --config deploy/fly.toml --image "${IMAGE}:${SHA}" --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Readiness answers UP
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${DEMO_URL}/api/actuator/health/readiness" | grep -q '"status":"UP"'; then
              echo "UP after ${attempt} attempts"; exit 0
            fi
            sleep 10
          done
          echo "readiness did not answer UP in 5 minutes" >&2; exit 1
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
