<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Resolve, plataforma de soporte: tickets, clientes, equipo y base de conocimiento."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Resolve</title>
    <!-- Aplica el tema guardado antes del primer pintado para evitar un destello del tema contrario. Es la salida literal de
         `themeScript({ storageKey: 'resolve-theme' })` de @yelison/forma-ui, byte a byte (lo comprueba
         `src/app/theme/firstPaint.test.ts`): el backend admite este script en la CSP con el hash de su contenido, así que
         no se reformatea ni se edita a mano. -->
    <!-- prettier-ignore -->
    <script>try{const t=localStorage.getItem("resolve-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch{}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
