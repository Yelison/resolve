openapi: 3.1.0
info:
  title: Resolve API
  version: 0.1.0
  description: |
    Customer-support API for Resolve. Every request runs in the organization of the authenticated
    principal; see docs/api/README.md for roles, pagination, concurrency and metrics rules.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
security:
  - demoUser: []
  - {}
tags:
  - name: Session
    description: The authenticated member and their organization.
  - name: Tickets
    description: Inbox, detail, updates, metrics and activity.
  - name: Messages
    description: Public replies and internal notes of a ticket.
  - name: Customers
    description: Customer directory, profile, archiving and the customer search used by forms.
  - name: Assignees
    description: Members who can own tickets.
  - name: Team
    description: Members of the organization, their invitations, roles and removal.
  - name: Reports
    description: Aggregated figures of the organization over a period.

paths:
  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Current user, organization and role
      responses:
        '200':
          description: The authenticated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tickets:
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: Ticket inbox
      description: |
        Agents and admins see every ticket of the organization; customers only see the tickets of
        their own customer record. Filters combine with AND; repeated values of one filter combine with OR.
      parameters:
        - name: view
          in: query
          schema: { $ref: '#/components/schemas/TicketView' }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketStatus' }
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketPriority' }
        - name: assigneeId
          in: query
          description: A member id, or `none` for unassigned tickets.
          schema:
            type: string
            pattern: '^(none|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        - name: customerId
          in: query
          description: |
            Only tickets of this customer. For customer members it combines with their own scope,
            so another id yields no results.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: |
            Case-insensitive contains match on the subject and the customer name, email and company;
            a number, with or without `#`, matches the ticket number exactly.
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |
            `field,direction`. `priority` and `status` sort by rank (urgent → low; open → in_progress →
            waiting → resolved), not alphabetically. Ties are broken by `number,desc`.
          schema:
            type: string
            default: updatedAt,desc
            pattern: '^(updatedAt|createdAt|number|priority|status),(asc|desc)$'
      responses:
        '200':
          description: One page of tickets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Create a ticket
      description: |
        `customerId` and `assigneeId` must belong to the caller's organization (the assignee must be an
        admin or agent). Unknown and foreign ids get the same 400 field error, so other organizations'
        data is never revealed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
      responses:
        '201':
          description: The created ticket.
          headers:
            Location:
              schema: { type: string }
              description: URL of the ticket, `/api/tickets/{number}`.
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/metrics:
    get:
      tags: [Tickets]
      operationId: getTicketMetrics
      summary: Inbox metrics for the whole organization
      description: Not affected by inbox filters. Days are computed in the organization time zone.
      responses:
        '200':
          description: Organization-wide metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/activity:
    get:
      tags: [Tickets]
      operationId: listRecentActivity
      summary: Latest activity of the whole organization, newest first (not paginated)
      description: |
        Staff only. The most recent entries of the activity logs of every ticket of the organization, each with
        the number and subject of its ticket. Internal notes are messages, not activity, and never appear.
      parameters:
        - $ref: '#/components/parameters/ActivityFeedSize'
      responses:
        '200':
          description: Activity entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityFeedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/{number}:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Ticket detail
      responses:
        '200':
          description: The ticket.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Change status, priority and/or assignee
      description: |
        JSON Merge Patch semantics: absent fields are unchanged and `assigneeId: null` unassigns the
        ticket. Requires `If-Match` with the current version. A patch that changes nothing returns 200
        without a new version or activity entry. Errors are checked in this order: 401, 403, 404, 428,
        400, 412.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: A single strong validator with the current version, as returned in `ETag`.
          schema: { type: string, pattern: '^"\d+"$', examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TicketPatch' }
      responses:
        '200':
          description: The updated ticket.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /tickets/{number}/messages:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Conversation of a ticket, oldest first
      description: |
        Not paginated. Customers only receive `public` messages. The ticket `description` is part of
        the ticket, not the first message.
      responses:
        '200':
          description: Messages of the ticket.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Reply to the customer or add an internal note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: The created message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{number}/activity:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      tags: [Tickets]
      operationId: listActivity
      summary: Activity log of a ticket, newest first (not paginated)
      responses:
        '200':
          description: Activity entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Paginated customer list and search
      description: |
        Archived customers are left out unless `archived=true`, which lists only them. The result never
        includes customers of other organizations. `openTickets` counts the customer's tickets that are
        not `resolved`.
      parameters:
        - name: q
          in: query
          description: Searches the name, email and company.
          schema: { type: string, maxLength: 120 }
        - name: company
          in: query
          description: Exact company name, compared case-insensitively. An unknown company gives an empty page.
          schema: { type: string, maxLength: 120 }
        - name: archived
          in: query
          description: '`false` (default) lists active customers; `true` lists only archived ones.'
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |
            `field,direction` with `name`, `createdAt` or `openTickets`. Names compare case-insensitively;
            ties are broken by `id,asc`.
          schema:
            type: string
            default: name,asc
            pattern: '^(name|createdAt|openTickets),(asc|desc)$'
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: |
        The email must be unique in the organization, ignoring case and including archived customers; a
        duplicate is a 400 field error on `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          description: The created customer.
          headers:
            Location:
              schema: { type: string }
              description: URL of the customer, `/api/customers/{id}`.
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/metrics:
    get:
      tags: [Customers]
      operationId: getCustomerMetrics
      summary: Customer metrics for the whole organization
      description: |
        Computed over the active (non-archived) customers of the organization and not affected by list
        filters. `newThisMonth` uses the current month in the organization time zone.
      responses:
        '200':
          description: Organization-wide customer metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/companies:
    get:
      tags: [Customers]
      operationId: listCompanies
      summary: Distinct company names of the active customers
      description: |
        Case-insensitive alphabetical order, at most 200 names, without empty values. Names that only differ
        in case are listed once. Archived customers do not contribute.
      responses:
        '200':
          description: Company names.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Customer detail
      description: Archived customers can be read. Foreign and unknown ids both answer 404.
      responses:
        '200':
          description: The customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Edit a customer's contact data and notes
      description: |
        JSON Merge Patch semantics: absent fields are unchanged and `null` clears `company` and `notes`
        (`name` and `email` do not accept `null`). Requires `If-Match` with the current version. A patch that
        changes nothing returns 200 without a new version. An archived customer cannot be edited: restore it
        first (409). Errors are checked in this order: 401, 403, 404, 428, 400, 412, 409.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: A single strong validator with the current version, as returned in `ETag`.
          schema: { type: string, pattern: '^"\d+"$', examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CustomerPatch' }
      responses:
        '200':
          description: The updated customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /customers/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Customers]
      operationId: archiveCustomer
      summary: Archive a customer (admin only)
      description: |
        Hides the customer from lists, search, metrics and the new-ticket selector; their tickets stay
        visible and editable and their portal access stops working. Archiving an archived customer is a 409.
      responses:
        '200':
          description: The archived customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Customers]
      operationId: restoreCustomer
      summary: Restore an archived customer (admin only)
      description: Brings the customer back to every list and resumes portal access. Restoring an active customer is a 409.
      responses:
        '200':
          description: The restored customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}/invite:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Customers]
      operationId: inviteCustomer
      summary: Invite a customer to the portal (admin only)
      description: |
        Creates an `invited` `customer` membership bound to the customer's email, creating the user when the
        email is new; no email is sent. The person gets access by signing in with that address, which activates
        the membership on their first request. A membership of the same customer that was `removed` is invited
        again on the same row. The customer must be active: inviting an archived customer is a 409 (restore it
        first), and so is a customer that already has an `invited` or `active` access, whose email belongs to a
        team member, or whose user is already linked to another customer.
      responses:
        '201':
          description: The invited portal member (`role` is `customer`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members:
    get:
      tags: [Team]
      operationId: listMembers
      summary: Members of the team (admins and agents) with their status and load
      description: |
        Every admin and agent of the organization in any status, including `removed` ones (clients hide
        them by default), ordered by name and then id. Customers with portal access are not part of the team.
        `openTickets` counts the unresolved tickets assigned to the member.
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Team]
      operationId: inviteMember
      summary: Invite an admin or agent (admin only)
      description: |
        Creates an `invited` membership bound to the email, creating the user when the email is new. No email is
        sent: the person joins by signing in with that address, which activates the membership on their first
        request. Inviting an email that was removed from the team brings the same membership back to `invited`
        with the new role. An email that is already an active or invited member, or that belongs to a customer of
        the organization, is a 400 on the field `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInvite' }
            example: { email: sofia.rios@acme.example, name: Sofía Ríos, role: agent }
      responses:
        '201':
          description: The invited member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members/metrics:
    get:
      tags: [Team]
      operationId: getTeamMetrics
      summary: Team metrics for the whole organization
      description: |
        `staff` counts the active admins and agents. `assignedOpen` and `unassignedOpen` count the unresolved
        tickets with and without an assignee. `averageLoad` is `assignedOpen / staff` with one decimal (`0`
        without staff). `firstResponseMinutes` is the same median as in the ticket metrics.
      responses:
        '200':
          description: Organization-wide team metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/MemberUserId'
    post:
      tags: [Team]
      operationId: changeMemberRole
      summary: Change the role of an admin or agent (admin only)
      description: |
        Works on invited and active members. Changing the role of the last active admin is a 409, and so is
        changing the role of a removed member. A user that is not an admin or agent of the organization
        (unknown, from another organization or a customer) is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberRoleChange' }
            example: { role: admin }
      responses:
        '200':
          description: The member with their new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members/{userId}/remove:
    parameters:
      - $ref: '#/components/parameters/MemberUserId'
    post:
      tags: [Team]
      operationId: removeMember
      summary: Remove a member from the team (admin only)
      description: |
        Marks the membership `removed`; it is never deleted. The member stops being able to sign in, leaves
        `/assignees` and the team metrics, and their unresolved tickets are unassigned in the same transaction,
        each with an `assignee_changed` activity whose actor is the caller; resolved tickets keep their assignee.
        Removing oneself, the last active admin or an already removed member is a 409. A user that is not an
        admin or agent of the organization is a 404.
      responses:
        '200':
          description: The removed member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /assignees:
    get:
      tags: [Assignees]
      operationId: listAssignees
      summary: Members who can be assigned to tickets (admins and agents), by name
      responses:
        '200':
          description: Assignable members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/summary:
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: Report of the organization over a period, with the previous period of the same length
      description: |
        Staff only. Everything is computed on the server, per organization, in the organization time zone.
        The period covers the last `days` calendar days of the organization, today included: it starts at
        00:00 of `today - (days - 1)` and ends now. `previous` figures cover the adjacent period of the same
        duration (`[from - (to - from), from)`). Without data the counts are `0` and the medians `null`.
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    demoUser:
      type: apiKey
      in: header
      name: X-Demo-User
      description: |
        Only in the `dev` and `test` profiles: email of a seeded user. Other profiles have no
        authentication provider yet and answer 401.

  parameters:
    TicketNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberUserId:
      name: userId
      in: path
      description: Id of the member's user, as `TeamMember.id`.
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ActivityFeedSize:
      name: size
      in: query
      description: Number of entries to return.
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    ReportPeriod:
      name: period
      in: query
      description: Length of the report period, in calendar days of the organization time zone.
      schema: { type: string, enum: [7d, 30d, 90d], default: 7d }

  headers:
    ETag:
      description: Current version of the resource, quoted, for `If-Match`.
      schema: { type: string, examples: ['"3"'] }

  responses:
    BadRequest:
      description: Malformed request, invalid parameter or validation error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No authenticated principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The role does not allow the action.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found in the caller's scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: The resource changed since the client read it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: The update did not send `If-Match`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The action is not allowed in the current state of the resource (for example archiving twice).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Role:
      type: string
      enum: [admin, agent, customer]
    TicketStatus:
      type: string
      enum: [open, in_progress, waiting, resolved]
    TicketPriority:
      type: string
      enum: [urgent, high, medium, low]
    TicketChannel:
      type: string
      enum: [email, chat, phone, web]
    TicketView:
      description: |
        `all`: every ticket. `mine`: assigned to the caller and not resolved. `unassigned`: without
        assignee and not resolved. `resolved`: status `resolved`. Combined with the other filters by AND.
      type: string
      enum: [all, mine, unassigned, resolved]
      default: all
    MessageVisibility:
      type: string
      enum: [public, internal]

    Organization:
      type: object
      additionalProperties: false
      required: [id, name, timeZone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timeZone: { type: string, examples: [America/Bogota] }

    Me:
      type: object
      additionalProperties: false
      required: [user, organization, role, customerId]
      properties:
        user: { $ref: '#/components/schemas/Member' }
        organization: { $ref: '#/components/schemas/Organization' }
        role: { $ref: '#/components/schemas/Role' }
        customerId:
          description: Customer record of a `customer` member; null for admins and agents.
          type: [string, 'null']
          format: uuid

    Member:
      description: An admin or agent of the organization.
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    MemberRef:
      description: A member as shown inside other resources, without contact data.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    MemberStatus:
      description: |
        `invited`: bound to an email that has not signed in yet. `active`: can use the API. `removed`: can no
        longer sign in; the membership is kept for the history that references it.
      type: string
      enum: [invited, active, removed]

    TeamMember:
      description: |
        A member of the organization with their membership status: an admin or agent in the team routes, or the
        invited portal member (`role` `customer`) returned by `inviteCustomer`.
      type: object
      additionalProperties: false
      required: [id, name, email, role, status, openTickets, joinedAt, invitedAt]
      properties:
        id:
          description: Id of the member's user.
          type: string
          format: uuid
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        openTickets:
          description: Unresolved tickets assigned to the member.
          type: integer
          minimum: 0
        joinedAt:
          description: When the membership became active; null while it is `invited`.
          type: [string, 'null']
          format: date-time
        invitedAt:
          description: When the current invitation was made; null for members that never were invited.
          type: [string, 'null']
          format: date-time

    MemberInvite:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name:
          description: Defaults to the part of the email before the `@`. Ignored when the user already exists.
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum: [admin, agent]

    MemberRoleChange:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, agent]

    TeamMetrics:
      type: object
      additionalProperties: false
      required: [staff, assignedOpen, unassignedOpen, averageLoad, firstResponseMinutes, firstResponseTargetMinutes]
      properties:
        staff:
          description: Active admins and agents.
          type: integer
          minimum: 0
        assignedOpen:
          description: Unresolved tickets with an assignee.
          type: integer
          minimum: 0
        unassignedOpen:
          description: Unresolved tickets without an assignee.
          type: integer
          minimum: 0
        averageLoad:
          description: '`assignedOpen / staff` with one decimal; `0` without staff.'
          type: number
          minimum: 0
        firstResponseMinutes:
          description: Same median as `TicketMetrics.firstResponseMinutes`; null without data.
          type: [integer, 'null']
          minimum: 0
        firstResponseTargetMinutes: { type: integer, minimum: 1 }

    Customer:
      type: object
      additionalProperties: false
      required: [id, name, email, company]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }

    CustomerSummary:
      description: A customer in lists, with its ticket counts. `Customer` is the reference embedded in tickets.
      type: object
      additionalProperties: false
      required: [id, name, email, company, openTickets, totalTickets, createdAt, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }
        openTickets:
          description: Tickets of the customer whose status is not `resolved`.
          type: integer
          minimum: 0
        totalTickets: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        archived: { type: boolean }

    CustomerDetail:
      description: |
        A customer with its profile: every field of CustomerSummary plus `notes`, `archivedAt`, `version` and
        `portalAccess`. It is written out in full instead of composing CustomerSummary with `allOf`, because
        `additionalProperties: false` on each `allOf` branch makes a JSON Schema validator reject the fields of
        the other branch.
      type: object
      additionalProperties: false
      required:
        [id, name, email, company, openTickets, totalTickets, createdAt, archived, notes, archivedAt, version, portalAccess]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }
        openTickets:
          description: Tickets of the customer whose status is not `resolved`.
          type: integer
          minimum: 0
        totalTickets: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        archived: { type: boolean }
        notes: { type: [string, 'null'], maxLength: 2000 }
        archivedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        portalAccess:
          description: |
            Follows the status of the customer's membership: `none` without a membership or when it was removed,
            `invited` until the person first signs in, `active` afterwards. It does not account for archiving:
            while `archived` is `true` the portal access is suspended (the member gets 401) whatever
            `portalAccess` says. Clients should treat an archived customer as suspended.
          type: string
          enum: [none, invited, active]

    CustomerCreate:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        company: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CustomerPatch:
      description: Same fields as CustomerCreate, all optional. `name` and `email` do not accept `null`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        company: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CustomerMetrics:
      description: Counts over the active (non-archived) customers of the organization.
      type: object
      additionalProperties: false
      required: [total, companies, withOpenTickets, newThisMonth]
      properties:
        total: { type: integer, minimum: 0 }
        companies:
          description: Distinct non-empty company names, ignoring case.
          type: integer
          minimum: 0
        withOpenTickets:
          description: Customers with at least one ticket that is not `resolved`.
          type: integer
          minimum: 0
        newThisMonth:
          description: Customers created in the current month of the organization time zone.
          type: integer
          minimum: 0

    TicketSummary:
      type: object
      additionalProperties: false
      required: [id, number, subject, status, priority, channel, customer, assignee, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, minimum: 1 }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        channel: { $ref: '#/components/schemas/TicketChannel' }
        customer: { $ref: '#/components/schemas/Customer' }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt:
          description: Last activity, either a field change or a public message.
          type: string
          format: date-time

    Ticket:
      description: Ticket detail. Same fields as TicketSummary plus `description` and `version`.
      type: object
      additionalProperties: false
      required:
        [id, number, subject, status, priority, channel, customer, assignee, createdAt, updatedAt, description, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, minimum: 1 }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        channel: { $ref: '#/components/schemas/TicketChannel' }
        customer: { $ref: '#/components/schemas/Customer' }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        description: { type: string }
        version: { type: integer, format: int64, minimum: 0 }

    TicketCreate:
      type: object
      additionalProperties: false
      required: [customerId, subject, description]
      properties:
        customerId: { type: string, format: uuid }
        subject: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priority:
          $ref: '#/components/schemas/TicketPriority'
          default: medium
        channel:
          $ref: '#/components/schemas/TicketChannel'
          default: web
        assigneeId:
          type: [string, 'null']
          format: uuid

    TicketPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        assigneeId:
          description: '`null` unassigns the ticket.'
          type: [string, 'null']
          format: uuid

    TicketPage:
      description: An empty page past the last one is valid (200 with no items); `totalPages` is 0 when there are no items.
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TicketSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    CustomerPage:
      description: An empty page past the last one is valid (200 with no items); `totalPages` is 0 when there are no items.
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ViewCounts:
      type: object
      additionalProperties: false
      required: [all, mine, unassigned, resolved]
      properties:
        all: { type: integer, minimum: 0 }
        mine: { type: integer, minimum: 0 }
        unassigned: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }

    TicketMetrics:
      type: object
      additionalProperties: false
      required:
        - open
        - openedToday
        - inProgress
        - inProgressAssignedToMe
        - resolvedToday
        - resolvedYesterday
        - firstResponseMinutes
        - firstResponseTargetMinutes
        - views
      properties:
        open: { type: integer, minimum: 0 }
        openedToday:
          description: Tickets created today (organization time zone) that are still open.
          type: integer
          minimum: 0
        inProgress: { type: integer, minimum: 0 }
        inProgressAssignedToMe: { type: integer, minimum: 0 }
        resolvedToday:
          description: Distinct tickets that entered `resolved` today, from the activity log.
          type: integer
          minimum: 0
        resolvedYesterday: { type: integer, minimum: 0 }
        firstResponseMinutes:
          description: |
            Median minutes, rounded to the nearest integer, from creation to the first public agent
            message, over tickets created in the last 168 hours that have one; null when there are none.
          type: [integer, 'null']
          minimum: 0
        firstResponseTargetMinutes: { type: integer, minimum: 1 }
        views: { $ref: '#/components/schemas/ViewCounts' }

    MessageAuthor:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [agent, customer]

    Message:
      type: object
      additionalProperties: false
      required: [id, body, visibility, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        visibility: { $ref: '#/components/schemas/MessageVisibility' }
        author: { $ref: '#/components/schemas/MessageAuthor' }
        createdAt: { type: string, format: date-time }

    MessageCreate:
      type: object
      additionalProperties: false
      required: [body, visibility]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        visibility: { $ref: '#/components/schemas/MessageVisibility' }

    Activity:
      oneOf:
        - $ref: '#/components/schemas/TicketCreatedActivity'
        - $ref: '#/components/schemas/StatusChangedActivity'
        - $ref: '#/components/schemas/PriorityChangedActivity'
        - $ref: '#/components/schemas/AssigneeChangedActivity'
      discriminator:
        propertyName: type
        mapping:
          created: '#/components/schemas/TicketCreatedActivity'
          status_changed: '#/components/schemas/StatusChangedActivity'
          priority_changed: '#/components/schemas/PriorityChangedActivity'
          assignee_changed: '#/components/schemas/AssigneeChangedActivity'

    TicketCreatedActivity:
      type: object
      additionalProperties: false
      required: [id, type, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: created }
        actor: { $ref: '#/components/schemas/MemberRef' }
        createdAt: { type: string, format: date-time }

    StatusChangedActivity:
      type: object
      additionalProperties: false
      required: [id, type, actor, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: status_changed }
        actor: { $ref: '#/components/schemas/MemberRef' }
        from: { $ref: '#/components/schemas/TicketStatus' }
        to: { $ref: '#/components/schemas/TicketStatus' }
        createdAt: { type: string, format: date-time }

    PriorityChangedActivity:
      type: object
      additionalProperties: false
      required: [id, type, actor, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: priority_changed }
        actor: { $ref: '#/components/schemas/MemberRef' }
        from: { $ref: '#/components/schemas/TicketPriority' }
        to: { $ref: '#/components/schemas/TicketPriority' }
        createdAt: { type: string, format: date-time }

    AssigneeChangedActivity:
      description: '`from` and `to` keep the member id and the name at the time of the change; null means unassigned.'
      type: object
      additionalProperties: false
      required: [id, type, actor, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: assignee_changed }
        actor: { $ref: '#/components/schemas/MemberRef' }
        from:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        to:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    ActivityFeedItem:
      description: An activity entry of the organization together with the ticket it belongs to.
      type: object
      additionalProperties: false
      required: [ticketNumber, subject, activity]
      properties:
        ticketNumber: { type: integer, format: int64, minimum: 1, examples: [1048] }
        subject: { type: string, examples: [No puedo acceder a mi cuenta] }
        activity: { $ref: '#/components/schemas/Activity' }
      examples:
        - ticketNumber: 1048
          subject: No puedo acceder a mi cuenta
          activity:
            id: 4a7c1c52-3f6e-4a58-9d0b-2b2f7f9a6c10
            type: status_changed
            actor: { id: 3f0c2f9a-6a56-4d1f-9c3e-1f4b0a7d2c11, name: Laura Méndez }
            from: open
            to: in_progress
            createdAt: '2026-10-04T14:52:00Z'

    ReportSummary:
      type: object
      additionalProperties: false
      required: [period, created, resolved, firstResponseMinutes, resolutionHours, byDay, byChannel, byAgent]
      properties:
        period: { $ref: '#/components/schemas/ReportRange' }
        created: { $ref: '#/components/schemas/ReportCount' }
        resolved: { $ref: '#/components/schemas/ReportCount' }
        firstResponseMinutes: { $ref: '#/components/schemas/ReportFirstResponse' }
        resolutionHours: { $ref: '#/components/schemas/ReportResolution' }
        byDay:
          description: One entry per calendar day of the period, oldest first; days without data are `0`.
          type: array
          items: { $ref: '#/components/schemas/ReportDay' }
        byChannel:
          description: |
            Channels with at least one ticket created in the period, largest first (ties by channel name);
            empty without data. The `share` values add up to exactly `100`.
          type: array
          items: { $ref: '#/components/schemas/ReportChannel' }
        byAgent:
          description: |
            Every active admin and agent, plus the members who are no longer active (removed, or invited again)
            and resolved tickets or gave a first response in the period, most resolved first (ties by name, then
            id). `status` tells them apart.
          type: array
          items: { $ref: '#/components/schemas/ReportAgent' }
      examples:
        - period: { from: '2026-09-28T05:00:00Z', to: '2026-10-04T15:00:00Z', days: 7, timeZone: America/Bogota }
          created: { value: 42, previous: 38 }
          resolved: { value: 35, previous: 31 }
          firstResponseMinutes: { value: 18, previous: 22, target: 30 }
          resolutionHours: { value: 6.5, previous: null }
          byDay:
            - { date: '2026-09-28', created: 6, resolved: 5 }
          byChannel:
            - { channel: email, created: 30, share: 71.4 }
            - { channel: chat, created: 12, share: 28.6 }
          byAgent:
            - member: { id: 3f0c2f9a-6a56-4d1f-9c3e-1f4b0a7d2c11, name: Laura Méndez }
              status: active
              resolved: 20
              firstResponseMinutes: 15
              openAssigned: 4

    ReportRange:
      description: |
        The window the report covers. `from` is the start of the first day in the organization time zone and
        `to` is the moment of the request rounded up to a whole second, so it never leaves out a ticket created
        a fraction of a second earlier.
      type: object
      additionalProperties: false
      required: [from, to, days, timeZone]
      properties:
        from: { type: string, format: date-time, examples: ['2026-09-28T05:00:00Z'] }
        to: { type: string, format: date-time, examples: ['2026-10-04T15:00:00Z'] }
        days: { type: integer, enum: [7, 30, 90], examples: [7] }
        timeZone: { type: string, examples: [America/Bogota] }

    ReportCount:
      type: object
      additionalProperties: false
      required: [value, previous]
      properties:
        value:
          description: Count in the period.
          type: integer
          minimum: 0
          examples: [42]
        previous:
          description: Count in the previous period of the same duration.
          type: integer
          minimum: 0
          examples: [38]

    ReportFirstResponse:
      description: |
        Median minutes, rounded to the nearest integer, from creation to the first public agent message, over
        the tickets created in the period that have one; `null` when there are none.
      type: object
      additionalProperties: false
      required: [value, previous, target]
      properties:
        value: { type: [integer, 'null'], minimum: 0, examples: [18] }
        previous: { type: [integer, 'null'], minimum: 0, examples: [22] }
        target:
          description: Organization target, in minutes.
          type: integer
          minimum: 1
          examples: [30]

    ReportResolution:
      description: |
        Median hours, with one decimal, from creation to the first time a ticket entered `resolved`, over the
        tickets created in the period that were resolved; `null` when there are none.
      type: object
      additionalProperties: false
      required: [value, previous]
      properties:
        value: { type: [number, 'null'], minimum: 0, examples: [6.5] }
        previous: { type: [number, 'null'], minimum: 0, examples: [null] }

    ReportDay:
      type: object
      additionalProperties: false
      required: [date, created, resolved]
      properties:
        date:
          description: Calendar day in the organization time zone.
          type: string
          format: date
          examples: ['2026-09-28']
        created:
          description: Tickets created that day.
          type: integer
          minimum: 0
          examples: [6]
        resolved:
          description: |
            Distinct tickets that entered `resolved` that day. A ticket resolved, reopened and resolved again on
            different days counts on each of them, so the days can add up to more than `resolved.value`.
          type: integer
          minimum: 0
          examples: [5]

    ReportChannel:
      type: object
      additionalProperties: false
      required: [channel, created, share]
      properties:
        channel: { $ref: '#/components/schemas/TicketChannel' }
        created:
          description: Tickets created in the period through this channel.
          type: integer
          minimum: 1
          examples: [30]
        share:
          description: Percentage of the tickets created in the period, one decimal.
          type: number
          minimum: 0
          maximum: 100
          examples: [71.4]

    ReportAgent:
      type: object
      additionalProperties: false
      required: [member, status, resolved, firstResponseMinutes, openAssigned]
      properties:
        member: { $ref: '#/components/schemas/MemberRef' }
        status:
          description: Membership status. Anything other than `active` is someone who left but worked in the period.
          allOf:
            - $ref: '#/components/schemas/MemberStatus'
        resolved:
          description: Distinct tickets this member moved to `resolved` in the period (the actor of the activity).
          type: integer
          minimum: 0
          examples: [20]
