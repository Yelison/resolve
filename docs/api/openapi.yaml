openapi: 3.1.0
info:
  title: Resolve API
  version: 0.1.0
  description: |
    Customer-support API for Resolve. Every request runs in the organization of the authenticated
    principal; see docs/api/README.md for roles, pagination, concurrency and metrics rules.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
security:
  - sessionCookie: []
  - demoUser: []
  - {}
tags:
  - name: Session
    description: The authenticated member, their organization, the choice of organization and sign-out.
  - name: Organization
    description: Settings of the organization (name, support address, time zone, first-response target).
  - name: Tickets
    description: Inbox, detail, updates, metrics and activity.
  - name: Messages
    description: Public replies and internal notes of a ticket.
  - name: Customers
    description: Customer directory, profile, archiving and the customer search used by forms.
  - name: Assignees
    description: Members who can own tickets.
  - name: Team
    description: Members of the organization, their invitations, roles and removal.
  - name: Reports
    description: Aggregated figures of the organization over a period.
  - name: Knowledge
    description: Categories and Markdown articles of the knowledge base, with draft/published and internal/public visibility.

paths:
  /me:
    get:
      tags: [Session]
      operationId: getMe
      summary: Current user, organization and role
      responses:
        '200':
          description: The authenticated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Session]
      operationId: updateMe
      summary: Edit the caller's own display name
      description: |
        Every role can call it; the only editable field is `name`. It changes the person (`users.name`), not
        the customer record that staff manage, and shows up live wherever a staff member is shown as a
        `MemberRef` (assignee, authors of staff messages, team, assignees, reports) and in `/me`. The activity
        history (`/tickets/{number}/activity` and `/tickets/activity`) keeps the name it had when it was recorded.
        For a `customer` member only `/me` changes: their tickets and messages keep showing the customer record.
        A person who belongs to several organizations has the same name in all of them. There is no `If-Match`: the resource has a
        single owner, so there is no concurrent editor to protect.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: The caller with the new name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /session/organizations:
    get:
      tags: [Session]
      operationId: listSessionOrganizations
      summary: Organizations the caller can work in
      description: |
        Organizations where the caller has a usable membership (`invited` or `active`; not `removed`, and not
        a customer record that was archived), by name and then id. The one in use is `Me.organization`.
        Every role can call it.
      responses:
        '200':
          description: The organizations of the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrganizationRef' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /session/organization:
    post:
      tags: [Session]
      operationId: selectSessionOrganization
      summary: Work in another of the caller's organizations
      description: |
        Stores the choice in the server session; later requests resolve the principal in that organization for as
        long as the caller keeps a usable membership there. This is the only place where an organization id
        arrives from the client, and it is never trusted: it is checked against the memberships of the verified
        identity. An organization where the caller has no usable membership answers `403` exactly like one that
        does not exist, so the existence of other organizations is not revealed. An `invited` membership is
        activated by the first request that resolves into it, like at sign-in. A malformed id is a `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionOrganizationSelection' }
      responses:
        '200':
          description: The caller in the chosen organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /logout:
    post:
      tags: [Session]
      operationId: logout
      summary: End the session, and the provider's session with it
      description: |
        Only with the `oidc` profile. Invalidates the server session, deletes its cookie and answers `200` with
        `logoutUrl`: the identity provider's end-session endpoint with `id_token_hint` and `post_logout_redirect_uri`
        (the public URL of the application). The client must navigate there (`window.location.assign`) so the
        provider's own session ends too; otherwise the next sign-in with the same browser would complete without
        asking for credentials. If the provider publishes no end-session endpoint, or the caller had no session,
        `logoutUrl` is just the public URL. It is idempotent and needs the CSRF header like every unsafe request
        (`403` without it). The URL carries the ID token of the person who signs out and nothing else of the
        client: no secret, no access or refresh token, no session id.
      responses:
        '200':
          description: The session ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organization:
    get:
      tags: [Organization]
      operationId: getOrganization
      summary: Settings of the caller's organization
      description: Readable by admins and agents; customers get 403.
      responses:
        '200':
          description: The settings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Organization]
      operationId: updateOrganization
      summary: Edit the settings of the organization (admin only)
      description: |
        JSON Merge Patch semantics: absent fields are unchanged; `supportEmail` accepts `null` to clear it
        (the documented form; an empty or blank text is tolerated and also clears it) and no other field does. `timeZone` must be an IANA region id that PostgreSQL also
        knows, spelled exactly (`America/Bogota`); offsets, aliases such as `UTC+5` and other spellings are a
        400 on `timeZone`. Requires `If-Match` with the current version; a patch that changes nothing returns
        200 without a new version. Creating tickets does not change the version. Errors are checked in this
        order: 401, 403, 428, 400, 412.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: A single strong validator with the current version, as returned in `ETag`.
          schema: { type: string, pattern: '^"\d+"$', examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/OrganizationPatch' }
      responses:
        '200':
          description: The updated settings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /tickets:
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: Ticket inbox
      description: |
        Agents and admins see every ticket of the organization; customers only see the tickets of
        their own customer record. Filters combine with AND; repeated values of one filter combine with OR.
      parameters:
        - name: view
          in: query
          schema: { $ref: '#/components/schemas/TicketView' }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketStatus' }
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketPriority' }
        - name: assigneeId
          in: query
          description: A member id, or `none` for unassigned tickets.
          schema:
            type: string
            pattern: '^(none|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        - name: customerId
          in: query
          description: |
            Only tickets of this customer. For customer members it combines with their own scope,
            so another id yields no results.
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: |
            Case-insensitive contains match on the subject and the customer name, email and company;
            a number, with or without `#`, matches the ticket number exactly.
          schema: { type: string, maxLength: 120 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |
            `field,direction`. `priority` and `status` sort by rank (urgent → low; open → in_progress →
            waiting → resolved), not alphabetically. Ties are broken by `number,desc`.
          schema:
            type: string
            default: updatedAt,desc
            pattern: '^(updatedAt|createdAt|number|priority|status),(asc|desc)$'
      responses:
        '200':
          description: One page of tickets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Create a ticket
      description: |
        `customerId` and `assigneeId` must belong to the caller's organization (the assignee must be an
        admin or agent). Unknown and foreign ids get the same 400 field error, so other organizations'
        data is never revealed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
      responses:
        '201':
          description: The created ticket.
          headers:
            Location:
              schema: { type: string }
              description: URL of the ticket, `/api/tickets/{number}`.
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /tickets/metrics:
    get:
      tags: [Tickets]
      operationId: getTicketMetrics
      summary: Inbox metrics for the whole organization
      description: Not affected by inbox filters. Days are computed in the organization time zone.
      responses:
        '200':
          description: Organization-wide metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/activity:
    get:
      tags: [Tickets]
      operationId: listRecentActivity
      summary: Latest activity of the whole organization, newest first (not paginated)
      description: |
        Staff only. The most recent entries of the activity logs of every ticket of the organization, each with
        the number and subject of its ticket. Internal notes are messages, not activity, and never appear.
      parameters:
        - $ref: '#/components/parameters/ActivityFeedSize'
      responses:
        '200':
          description: Activity entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityFeedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tickets/{number}:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Ticket detail
      responses:
        '200':
          description: The ticket.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Change status, priority and/or assignee
      description: |
        JSON Merge Patch semantics: absent fields are unchanged and `assigneeId: null` unassigns the
        ticket. Requires `If-Match` with the current version. A patch that changes nothing returns 200
        without a new version or activity entry. Errors are checked in this order: 401, 403, 404, 428,
        400, 412.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: A single strong validator with the current version, as returned in `ETag`.
          schema: { type: string, pattern: '^"\d+"$', examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/TicketPatch' }
      responses:
        '200':
          description: The updated ticket.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /tickets/{number}/messages:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Conversation of a ticket, oldest first
      description: |
        Not paginated. Customers only receive `public` messages. The ticket `description` is part of
        the ticket, not the first message.
      responses:
        '200':
          description: Messages of the ticket.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Reply to the customer or add an internal note
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: The created message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{number}/activity:
    parameters:
      - $ref: '#/components/parameters/TicketNumber'
    get:
      tags: [Tickets]
      operationId: listActivity
      summary: Activity log of a ticket, newest first (not paginated)
      responses:
        '200':
          description: Activity entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Paginated customer list and search
      description: |
        Archived customers are left out unless `archived=true`, which lists only them. The result never
        includes customers of other organizations. `openTickets` counts the customer's tickets that are
        not `resolved`.
      parameters:
        - name: q
          in: query
          description: Searches the name, email and company.
          schema: { type: string, maxLength: 120 }
        - name: company
          in: query
          description: Exact company name, compared case-insensitively. An unknown company gives an empty page.
          schema: { type: string, maxLength: 120 }
        - name: archived
          in: query
          description: '`false` (default) lists active customers; `true` lists only archived ones.'
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |
            `field,direction` with `name`, `createdAt` or `openTickets`. Names compare case-insensitively;
            ties are broken by `id,asc`.
          schema:
            type: string
            default: name,asc
            pattern: '^(name|createdAt|openTickets),(asc|desc)$'
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: |
        The email must be unique in the organization, ignoring case and including archived customers; a
        duplicate is a 400 field error on `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerCreate' }
      responses:
        '201':
          description: The created customer.
          headers:
            Location:
              schema: { type: string }
              description: URL of the customer, `/api/customers/{id}`.
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/metrics:
    get:
      tags: [Customers]
      operationId: getCustomerMetrics
      summary: Customer metrics for the whole organization
      description: |
        Computed over the active (non-archived) customers of the organization and not affected by list
        filters. `newThisMonth` uses the current month in the organization time zone.
      responses:
        '200':
          description: Organization-wide customer metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/companies:
    get:
      tags: [Customers]
      operationId: listCompanies
      summary: Distinct company names of the active customers
      description: |
        Case-insensitive alphabetical order, at most 200 names, without empty values. Names that only differ
        in case are listed once. Archived customers do not contribute.
      responses:
        '200':
          description: Company names.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Customer detail
      description: Archived customers can be read. Foreign and unknown ids both answer 404.
      responses:
        '200':
          description: The customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Edit a customer's contact data and notes
      description: |
        JSON Merge Patch semantics: absent fields are unchanged and `null` clears `company` and `notes`
        (`name` and `email` do not accept `null`). Requires `If-Match` with the current version. A patch that
        changes nothing returns 200 without a new version. An archived customer cannot be edited: restore it
        first (409). Errors are checked in this order: 401, 403, 404, 428, 400, 412, 409.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: A single strong validator with the current version, as returned in `ETag`.
          schema: { type: string, pattern: '^"\d+"$', examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/CustomerPatch' }
      responses:
        '200':
          description: The updated customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /customers/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Customers]
      operationId: archiveCustomer
      summary: Archive a customer (admin only)
      description: |
        Hides the customer from lists, search, metrics and the new-ticket selector; their tickets stay
        visible and editable and their portal access stops working. Archiving an archived customer is a 409.
      responses:
        '200':
          description: The archived customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /customers/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Customers]
      operationId: restoreCustomer
      summary: Restore an archived customer (admin only)
      description: Brings the customer back to every list and resumes portal access. Restoring an active customer is a 409.
      responses:
        '200':
          description: The restored customer.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /customers/{id}/invite:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      tags: [Customers]
      operationId: inviteCustomer
      summary: Invite a customer to the portal (admin only)
      description: |
        Creates an `invited` `customer` membership bound to the customer's email, creating the user when the
        email is new; no email is sent. The person gets access by signing in with that address, which activates
        the membership on their first request. A membership of the same customer that was `removed` is invited
        again on the same row. The customer must be active: inviting an archived customer is a 409 (restore it
        first), and so is a customer that already has an `invited` or `active` access, whose email belongs to a
        team member, or whose user is already linked to another customer.
      responses:
        '201':
          description: The invited portal member (`role` is `customer`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /members:
    get:
      tags: [Team]
      operationId: listMembers
      summary: Members of the team (admins and agents) with their status and load
      description: |
        Every admin and agent of the organization in any status, including `removed` ones (clients hide
        them by default), ordered by name and then id. Customers with portal access are not part of the team.
        `openTickets` counts the unresolved tickets assigned to the member.
      responses:
        '200':
          description: The team.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Team]
      operationId: inviteMember
      summary: Invite an admin or agent (admin only)
      description: |
        Creates an `invited` membership bound to the email, creating the user when the email is new. No email is
        sent: the person joins by signing in with that address, which activates the membership on their first
        request. Inviting an email that was removed from the team brings the same membership back to `invited`
        with the new role. An email that is already an active or invited member, or that belongs to a customer of
        the organization, is a 400 on the field `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberInvite' }
            example: { email: sofia.rios@acme.example, name: Sofía Ríos, role: agent }
      responses:
        '201':
          description: The invited member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members/metrics:
    get:
      tags: [Team]
      operationId: getTeamMetrics
      summary: Team metrics for the whole organization
      description: |
        `staff` counts the active admins and agents. `assignedOpen` and `unassignedOpen` count the unresolved
        tickets with and without an assignee. `averageLoad` is `assignedOpen / staff` with one decimal (`0`
        without staff). `firstResponseMinutes` is the same median as in the ticket metrics.
      responses:
        '200':
          description: Organization-wide team metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/MemberUserId'
    post:
      tags: [Team]
      operationId: changeMemberRole
      summary: Change the role of an admin or agent (admin only)
      description: |
        Works on invited and active members. Changing the role of the last active admin is a 409, and so is
        changing the role of a removed member. A user that is not an admin or agent of the organization
        (unknown, from another organization or a customer) is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberRoleChange' }
            example: { role: admin }
      responses:
        '200':
          description: The member with their new role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /members/{userId}/remove:
    parameters:
      - $ref: '#/components/parameters/MemberUserId'
    post:
      tags: [Team]
      operationId: removeMember
      summary: Remove a member from the team (admin only)
      description: |
        Marks the membership `removed`; it is never deleted. The member stops being able to sign in, leaves
        `/assignees` and the team metrics, and their unresolved tickets are unassigned in the same transaction,
        each with an `assignee_changed` activity whose actor is the caller; resolved tickets keep their assignee.
        Removing oneself, the last active admin or an already removed member is a 409. A user that is not an
        admin or agent of the organization is a 404.
      responses:
        '200':
          description: The removed member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /assignees:
    get:
      tags: [Assignees]
      operationId: listAssignees
      summary: Members who can be assigned to tickets (admins and agents), by name
      responses:
        '200':
          description: Assignable members.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/summary:
    get:
      tags: [Reports]
      operationId: getReportSummary
      summary: Report of the organization over a period, with the previous period of the same length
      description: |
        Staff only. Everything is computed on the server, per organization, in the organization time zone.
        The period covers the last `days` calendar days of the organization, today included: it starts at
        00:00 of `today - (days - 1)` and ends now. `previous` figures cover the adjacent period of the same
        duration (`[from - (to - from), from)`). Without data the counts are `0` and the medians `null`.
      parameters:
        - $ref: '#/components/parameters/ReportPeriod'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /knowledge/categories:
    get:
      tags: [Knowledge]
      operationId: listCategories
      summary: Categories of the knowledge base with their article counts
      description: |
        `articles` counts what the caller can read: every article for staff, only published and public ones
        for customers. A customer only receives the categories that have at least one such article, so an
        internal category never shows up for them. Ordered by name, ignoring case.
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Knowledge]
      operationId: createCategory
      summary: Create a category (admin only)
      description: |
        The slug comes from the name (`Slugs.from`, lowercase ASCII with hyphens) and never changes. A name whose
        slug already exists in the organization is a 400 field error on `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: The created category, without articles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /knowledge/articles:
    get:
      tags: [Knowledge]
      operationId: listArticles
      summary: Paginated article list and search
      description: |
        Staff see every article; customers only receive the `published` and `public` ones, whatever the filters:
        a customer who asks for `status=draft` gets an empty page. The result never includes articles of other
        organizations. `category` is a category slug, and an unknown slug gives an empty page.
      parameters:
        - name: q
          in: query
          description: Case-insensitive contains match on the title, the body and the category name.
          schema: { type: string, maxLength: 120 }
        - name: category
          in: query
          description: Slug of a category.
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ArticleStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: |
            `field,direction` with `updatedAt` or `title`. Titles compare case-insensitively; ties are broken by
            `id` in the same direction.
          schema:
            type: string
            default: updatedAt,desc
            pattern: '^(updatedAt|title),(asc|desc)$'
      responses:
        '200':
          description: One page of articles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticlePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Knowledge]
      operationId: createArticle
      summary: Create an article as a draft (staff)
      description: |
        The article starts as a `draft`. The slug comes from the title and never changes: `Slugs.from(title)`, and
        when it already exists in the organization the first free `-2`, `-3`… suffix. Two simultaneous creations
        with the same title get different slugs. A category that does not exist in the organization is a 400 field
        error on `categoryId`. The slugs `nuevo` and `editar` are reserved for the routes of the interface and are
        never assigned: a title that would produce one gets the next free suffix (`nuevo-2`). A 409 means another
        article took the slug in the instant between choosing it and saving (it cannot happen through this API, which
        serializes creations; the unique constraint is the last line of defence): the client can retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleCreate' }
      responses:
        '201':
          description: The created article.
          headers:
            Location:
              schema: { type: string }
              description: URL of the article, `/api/knowledge/articles/{slug}`.
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /knowledge/articles/{slug}:
    parameters:
      - $ref: '#/components/parameters/ArticleSlug'
    get:
      tags: [Knowledge]
      operationId: getArticle
      summary: Article detail
      description: |
        A customer can only read published, public articles: any other article answers 404, exactly like a slug
        that does not exist or belongs to another organization.
      responses:
        '200':
          description: The article.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Knowledge]
      operationId: updateArticle
      summary: Edit an article (staff)
      description: |
        JSON Merge Patch semantics: absent fields are unchanged and no field accepts `null`. The status is not
        patchable (use `publish` and `unpublish`) and the slug never changes. Requires `If-Match` with the
        current version. A patch that changes nothing returns 200 without a new version and without touching
        `updatedAt` or `updatedBy`. Errors are checked in this order: 401, 403, 404, 428, 400, 412.
      parameters:
        - name: If-Match
          in: header
          required: true
          description: A single strong validator with the current version, as returned in `ETag`.
          schema: { type: string, pattern: '^"\d+"$', examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ArticlePatch' }
      responses:
        '200':
          description: The updated article.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /knowledge/articles/{slug}/publish:
    parameters:
      - $ref: '#/components/parameters/ArticleSlug'
    post:
      tags: [Knowledge]
      operationId: publishArticle
      summary: Publish an article (staff)
      description: |
        Sets `status` to `published` and `publishedAt` to now; a published article with `public` visibility
        becomes readable by customers. Publishing a published article is a 409.
      responses:
        '200':
          description: The published article.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

  /knowledge/articles/{slug}/unpublish:
    parameters:
      - $ref: '#/components/parameters/ArticleSlug'
    post:
      tags: [Knowledge]
      operationId: unpublishArticle
      summary: Take an article back to draft (staff)
      description: |
        Sets `status` to `draft` and clears `publishedAt`; customers stop seeing the article at once (404).
        Unpublishing a draft is a 409.
      responses:
        '200':
          description: The article as a draft.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/LockTimeout' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        Only with the `oidc` profile. The browser signs in by navigating to `/api/oauth2/authorization/resolve`
        (OpenID Connect, authorization code with PKCE); the API keeps the tokens on the server and answers with an
        `HttpOnly`, `SameSite=Lax` session cookie. Requests authenticated by that cookie must also send the CSRF
        token: the API sets a readable `XSRF-TOKEN` cookie and expects its value in the `X-XSRF-TOKEN` header on
        every `POST`, `PATCH`, `PUT` and `DELETE`; without it the answer is `403`. A missing or expired session
        is a `401` Problem, never a redirect.
    demoUser:
      type: apiKey
      in: header
      name: X-Demo-User
      description: |
        Only in the `dev` and `test` profiles, and never together with `oidc`: email of a seeded user.
        In any other profile the header is ignored.

  parameters:
    TicketNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberUserId:
      name: userId
      in: path
      description: Id of the member's user, as `TeamMember.id`.
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ActivityFeedSize:
      name: size
      in: query
      description: Number of entries to return.
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    ArticleSlug:
      name: slug
      in: path
      description: Slug of the article; it never changes after creation.
      required: true
      schema: { type: string, minLength: 1, maxLength: 120 }
    ReportPeriod:
      name: period
      in: query
      description: Length of the report period, in calendar days of the organization time zone.
      schema: { type: string, enum: [7d, 30d, 90d], default: 7d }

  headers:
    ETag:
      description: Current version of the resource, quoted, for `If-Match`.
      schema: { type: string, examples: ['"3"'] }

  responses:
    BadRequest:
      description: Malformed request, invalid parameter or validation error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LockTimeout:
      description: >-
        Another transaction held the row for longer than the server waits (3 seconds). Nothing was changed: the
        same request can be sent again after `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before repeating the request.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: No authenticated principal.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The role does not allow the action.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found in the caller's scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: The resource changed since the client read it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: The update did not send `If-Match`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The action is not allowed in the current state of the resource (for example archiving twice).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Role:
      type: string
      enum: [admin, agent, customer]
    TicketStatus:
      type: string
      enum: [open, in_progress, waiting, resolved]
    TicketPriority:
      type: string
      enum: [urgent, high, medium, low]
    TicketChannel:
      type: string
      enum: [email, chat, phone, web]
    TicketView:
      description: |
        `all`: every ticket. `mine`: assigned to the caller and not resolved. `unassigned`: without
        assignee and not resolved. `resolved`: status `resolved`. Combined with the other filters by AND.
      type: string
      enum: [all, mine, unassigned, resolved]
      default: all
    MessageVisibility:
      type: string
      enum: [public, internal]

    Organization:
      type: object
      additionalProperties: false
      required: [id, name, timeZone, supportEmail]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timeZone: { type: string, examples: [America/Bogota] }
        supportEmail:
          description: Public support address shown in the knowledge base footer; null when not set.
          type: [string, 'null']
          format: email

    OrganizationSettings:
      type: object
      additionalProperties: false
      required: [id, name, supportEmail, timeZone, firstResponseTargetMinutes, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        supportEmail: { type: [string, 'null'], format: email, maxLength: 254 }
        timeZone: { type: string, examples: [America/Bogota] }
        firstResponseTargetMinutes:
          description: Target for the first public reply; the reference of the ticket metrics and the reports.
          type: integer
          minimum: 1
          maximum: 1440
        version: { type: integer, minimum: 0, description: Same value as the ETag. }

    OrganizationPatch:
      description: All fields optional. Only `supportEmail` accepts `null`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        supportEmail: { type: [string, 'null'], format: email, maxLength: 254 }
        timeZone: { type: string, examples: [America/Bogota] }
        firstResponseTargetMinutes: { type: integer, minimum: 1, maximum: 1440 }

    ProfilePatch:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    OrganizationRef:
      description: An organization as listed for the choice of the active one.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    LogoutResponse:
      type: object
      additionalProperties: false
      required: [logoutUrl]
      properties:
        logoutUrl:
          description: Where the client navigates to finish signing out at the identity provider.
          type: string
          format: uri

    SessionOrganizationSelection:
      type: object
      additionalProperties: false
      required: [organizationId]
      properties:
        organizationId: { type: string, format: uuid }

    Me:
      type: object
      additionalProperties: false
      required: [user, organization, role, customerId]
      properties:
        user: { $ref: '#/components/schemas/Member' }
        organization: { $ref: '#/components/schemas/Organization' }
        organizations:
          description: |
            Organizations where the caller can work, so a client can offer the switch without another request.
            Optional: it is present in responses of the API and clients may omit it in their own fixtures.
          type: array
          items: { $ref: '#/components/schemas/OrganizationRef' }
        role: { $ref: '#/components/schemas/Role' }
        customerId:
          description: Customer record of a `customer` member; null for admins and agents.
          type: [string, 'null']
          format: uuid

    Member:
      description: An admin or agent of the organization.
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }

    MemberRef:
      description: A member as shown inside other resources, without contact data.
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    MemberStatus:
      description: |
        `invited`: bound to an email that has not signed in yet. `active`: can use the API. `removed`: can no
        longer sign in; the membership is kept for the history that references it.
      type: string
      enum: [invited, active, removed]

    TeamMember:
      description: |
        A member of the organization with their membership status: an admin or agent in the team routes, or the
        invited portal member (`role` `customer`) returned by `inviteCustomer`.
      type: object
      additionalProperties: false
      required: [id, name, email, role, status, openTickets, joinedAt, invitedAt]
      properties:
        id:
          description: Id of the member's user.
          type: string
          format: uuid
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        openTickets:
          description: Unresolved tickets assigned to the member.
          type: integer
          minimum: 0
        joinedAt:
          description: When the membership became active; null while it is `invited`.
          type: [string, 'null']
          format: date-time
        invitedAt:
          description: When the current invitation was made; null for members that never were invited.
          type: [string, 'null']
          format: date-time

    MemberInvite:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name:
          description: Defaults to the part of the email before the `@`. Ignored when the user already exists.
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          enum: [admin, agent]

    MemberRoleChange:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, agent]

    TeamMetrics:
      type: object
      additionalProperties: false
      required: [staff, assignedOpen, unassignedOpen, averageLoad, firstResponseMinutes, firstResponseTargetMinutes]
      properties:
        staff:
          description: Active admins and agents.
          type: integer
          minimum: 0
        assignedOpen:
          description: Unresolved tickets with an assignee.
          type: integer
          minimum: 0
        unassignedOpen:
          description: Unresolved tickets without an assignee.
          type: integer
          minimum: 0
        averageLoad:
          description: '`assignedOpen / staff` with one decimal; `0` without staff.'
          type: number
          minimum: 0
        firstResponseMinutes:
          description: Same median as `TicketMetrics.firstResponseMinutes`; null without data.
          type: [integer, 'null']
          minimum: 0
        firstResponseTargetMinutes: { type: integer, minimum: 1 }

    Customer:
      type: object
      additionalProperties: false
      required: [id, name, email, company]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }

    CustomerSummary:
      description: A customer in lists, with its ticket counts. `Customer` is the reference embedded in tickets.
      type: object
      additionalProperties: false
      required: [id, name, email, company, openTickets, totalTickets, createdAt, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }
        openTickets:
          description: Tickets of the customer whose status is not `resolved`.
          type: integer
          minimum: 0
        totalTickets: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        archived: { type: boolean }

    CustomerDetail:
      description: |
        A customer with its profile: every field of CustomerSummary plus `notes`, `archivedAt`, `version` and
        `portalAccess`. It is written out in full instead of composing CustomerSummary with `allOf`, because
        `additionalProperties: false` on each `allOf` branch makes a JSON Schema validator reject the fields of
        the other branch.
      type: object
      additionalProperties: false
      required:
        [id, name, email, company, openTickets, totalTickets, createdAt, archived, notes, archivedAt, version, portalAccess]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }
        openTickets:
          description: Tickets of the customer whose status is not `resolved`.
          type: integer
          minimum: 0
        totalTickets: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        archived: { type: boolean }
        notes: { type: [string, 'null'], maxLength: 2000 }
        archivedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        portalAccess:
          description: |
            Follows the status of the customer's membership: `none` without a membership or when it was removed,
            `invited` until the person first signs in, `active` afterwards. It does not account for archiving:
            while `archived` is `true` the portal access is suspended (the member gets 401) whatever
            `portalAccess` says. Clients should treat an archived customer as suspended.
          type: string
          enum: [none, invited, active]

    CustomerCreate:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        company: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CustomerPatch:
      description: Same fields as CustomerCreate, all optional. `name` and `email` do not accept `null`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        company: { type: [string, 'null'], maxLength: 120 }
        notes: { type: [string, 'null'], maxLength: 2000 }

    CustomerMetrics:
      description: Counts over the active (non-archived) customers of the organization.
      type: object
      additionalProperties: false
      required: [total, companies, withOpenTickets, newThisMonth]
      properties:
        total: { type: integer, minimum: 0 }
        companies:
          description: Distinct non-empty company names, ignoring case.
          type: integer
          minimum: 0
        withOpenTickets:
          description: Customers with at least one ticket that is not `resolved`.
          type: integer
          minimum: 0
        newThisMonth:
          description: Customers created in the current month of the organization time zone.
          type: integer
          minimum: 0

    TicketSummary:
      type: object
      additionalProperties: false
      required: [id, number, subject, status, priority, channel, customer, assignee, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, minimum: 1 }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        channel: { $ref: '#/components/schemas/TicketChannel' }
        customer: { $ref: '#/components/schemas/Customer' }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt:
          description: Last activity, either a field change or a public message.
          type: string
          format: date-time

    Ticket:
      description: Ticket detail. Same fields as TicketSummary plus `description` and `version`.
      type: object
      additionalProperties: false
      required:
        [id, number, subject, status, priority, channel, customer, assignee, createdAt, updatedAt, description, version]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, minimum: 1 }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        channel: { $ref: '#/components/schemas/TicketChannel' }
        customer: { $ref: '#/components/schemas/Customer' }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        description: { type: string }
        version: { type: integer, format: int64, minimum: 0 }

    TicketCreate:
      type: object
      additionalProperties: false
      required: [customerId, subject, description]
      properties:
        customerId: { type: string, format: uuid }
        subject: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priority:
          $ref: '#/components/schemas/TicketPriority'
          default: medium
        channel:
          $ref: '#/components/schemas/TicketChannel'
          default: web
        assigneeId:
          type: [string, 'null']
          format: uuid

    TicketPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        assigneeId:
          description: '`null` unassigns the ticket.'
          type: [string, 'null']
          format: uuid

    TicketPage:
      description: An empty page past the last one is valid (200 with no items); `totalPages` is 0 when there are no items.
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TicketSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    CustomerPage:
      description: An empty page past the last one is valid (200 with no items); `totalPages` is 0 when there are no items.
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ViewCounts:
      type: object
      additionalProperties: false
      required: [all, mine, unassigned, resolved]
      properties:
        all: { type: integer, minimum: 0 }
        mine: { type: integer, minimum: 0 }
        unassigned: { type: integer, minimum: 0 }
        resolved: { type: integer, minimum: 0 }

    TicketMetrics:
      type: object
      additionalProperties: false
      required:
        - open
        - openedToday
        - inProgress
        - inProgressAssignedToMe
        - resolvedToday
        - resolvedYesterday
        - firstResponseMinutes
        - firstResponseTargetMinutes
        - views
      properties:
        open: { type: integer, minimum: 0 }
        openedToday:
          description: Tickets created today (organization time zone) that are still open.
          type: integer
          minimum: 0
        inProgress: { type: integer, minimum: 0 }
        inProgressAssignedToMe: { type: integer, minimum: 0 }
        resolvedToday:
          description: Distinct tickets that entered `resolved` today, from the activity log.
          type: integer
          minimum: 0
        resolvedYesterday: { type: integer, minimum: 0 }
        firstResponseMinutes:
          description: |
            Median minutes, rounded to the nearest integer, from creation to the first public agent
            message, over tickets created in the last 168 hours that have one; null when there are none.
          type: [integer, 'null']
          minimum: 0
        firstResponseTargetMinutes: { type: integer, minimum: 1 }
        views: { $ref: '#/components/schemas/ViewCounts' }

    MessageAuthor:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          enum: [agent, customer]

    Message:
      type: object
      additionalProperties: false
      required: [id, body, visibility, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        visibility: { $ref: '#/components/schemas/MessageVisibility' }
        author: { $ref: '#/components/schemas/MessageAuthor' }
        createdAt: { type: string, format: date-time }

    MessageCreate:
      type: object
      additionalProperties: false
      required: [body, visibility]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        visibility: { $ref: '#/components/schemas/MessageVisibility' }

    Activity:
      oneOf:
        - $ref: '#/components/schemas/TicketCreatedActivity'
        - $ref: '#/components/schemas/StatusChangedActivity'
        - $ref: '#/components/schemas/PriorityChangedActivity'
        - $ref: '#/components/schemas/AssigneeChangedActivity'
      discriminator:
        propertyName: type
        mapping:
          created: '#/components/schemas/TicketCreatedActivity'
          status_changed: '#/components/schemas/StatusChangedActivity'
          priority_changed: '#/components/schemas/PriorityChangedActivity'
          assignee_changed: '#/components/schemas/AssigneeChangedActivity'

    TicketCreatedActivity:
      type: object
      additionalProperties: false
      required: [id, type, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: created }
        actor: { $ref: '#/components/schemas/MemberRef' }
        createdAt: { type: string, format: date-time }

    StatusChangedActivity:
      type: object
      additionalProperties: false
      required: [id, type, actor, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: status_changed }
        actor: { $ref: '#/components/schemas/MemberRef' }
        from: { $ref: '#/components/schemas/TicketStatus' }
        to: { $ref: '#/components/schemas/TicketStatus' }
        createdAt: { type: string, format: date-time }

    PriorityChangedActivity:
      type: object
      additionalProperties: false
      required: [id, type, actor, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: priority_changed }
        actor: { $ref: '#/components/schemas/MemberRef' }
        from: { $ref: '#/components/schemas/TicketPriority' }
        to: { $ref: '#/components/schemas/TicketPriority' }
        createdAt: { type: string, format: date-time }

    AssigneeChangedActivity:
      description: '`from` and `to` keep the member id and the name at the time of the change; null means unassigned.'
      type: object
      additionalProperties: false
      required: [id, type, actor, from, to, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: assignee_changed }
        actor: { $ref: '#/components/schemas/MemberRef' }
        from:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        to:
          oneOf:
            - $ref: '#/components/schemas/MemberRef'
            - type: 'null'
        createdAt: { type: string, format: date-time }

    ActivityFeedItem:
      description: An activity entry of the organization together with the ticket it belongs to.
      type: object
      additionalProperties: false
      required: [ticketNumber, subject, activity]
      properties:
        ticketNumber: { type: integer, format: int64, minimum: 1, examples: [1048] }
        subject: { type: string, examples: [No puedo acceder a mi cuenta] }
        activity: { $ref: '#/components/schemas/Activity' }
      examples:
        - ticketNumber: 1048
          subject: No puedo acceder a mi cuenta
          activity:
            id: 4a7c1c52-3f6e-4a58-9d0b-2b2f7f9a6c10
            type: status_changed
            actor: { id: 3f0c2f9a-6a56-4d1f-9c3e-1f4b0a7d2c11, name: Laura Méndez }
            from: open
            to: in_progress
            createdAt: '2026-10-04T14:52:00Z'

    ReportSummary:
      type: object
      additionalProperties: false
      required: [period, created, resolved, firstResponseMinutes, resolutionHours, byDay, byChannel, byAgent]
      properties:
        period: { $ref: '#/components/schemas/ReportRange' }
        created: { $ref: '#/components/schemas/ReportCount' }
        resolved: { $ref: '#/components/schemas/ReportCount' }
        firstResponseMinutes: { $ref: '#/components/schemas/ReportFirstResponse' }
        resolutionHours: { $ref: '#/components/schemas/ReportResolution' }
        byDay:
          description: One entry per calendar day of the period, oldest first; days without data are `0`.
          type: array
          items: { $ref: '#/components/schemas/ReportDay' }
        byChannel:
          description: |
            Channels with at least one ticket created in the period, largest first (ties by channel name);
            empty without data. The `share` values add up to exactly `100`.
          type: array
          items: { $ref: '#/components/schemas/ReportChannel' }
        byAgent:
          description: |
            Every active admin and agent, plus the members who are no longer active (removed, or invited again)
            and resolved tickets in the period or gave the first response to a ticket created in the period, most
            resolved first (ties by name, then id). `status` tells them apart.
          type: array
          items: { $ref: '#/components/schemas/ReportAgent' }
      examples:
        - period: { from: '2026-09-28T05:00:00Z', to: '2026-10-04T15:00:00Z', days: 7, timeZone: America/Bogota }
          created: { value: 42, previous: 38 }
          resolved: { value: 35, previous: 31 }
          firstResponseMinutes: { value: 18, previous: 22, target: 30 }
          resolutionHours: { value: 6.5, previous: null }
          byDay:
            - { date: '2026-09-28', created: 6, resolved: 5 }
          byChannel:
            - { channel: email, created: 30, share: 71.4 }
            - { channel: chat, created: 12, share: 28.6 }
          byAgent:
            - member: { id: 3f0c2f9a-6a56-4d1f-9c3e-1f4b0a7d2c11, name: Laura Méndez }
              status: active
              resolved: 20
              firstResponseMinutes: 15
              openAssigned: 4

    ReportRange:
      description: |
        The window the report covers. `from` is the start of the first day in the organization time zone and
        `to` is the moment of the request truncated to a whole second; a ticket created in the fraction of a
        second before the request shows up in the next report.
      type: object
      additionalProperties: false
      required: [from, to, days, timeZone]
      properties:
        from: { type: string, format: date-time, examples: ['2026-09-28T05:00:00Z'] }
        to: { type: string, format: date-time, examples: ['2026-10-04T15:00:00Z'] }
        days: { type: integer, enum: [7, 30, 90], examples: [7] }
        timeZone: { type: string, examples: [America/Bogota] }

    ReportCount:
      type: object
      additionalProperties: false
      required: [value, previous]
      properties:
        value:
          description: Count in the period.
          type: integer
          minimum: 0
          examples: [42]
        previous:
          description: Count in the previous period of the same duration.
          type: integer
          minimum: 0
          examples: [38]

    ReportFirstResponse:
      description: |
        Median minutes, rounded to the nearest integer, from creation to the first public agent message, over
        the tickets created in the period that have one; `null` when there are none.
      type: object
      additionalProperties: false
      required: [value, previous, target]
      properties:
        value: { type: [integer, 'null'], minimum: 0, examples: [18] }
        previous: { type: [integer, 'null'], minimum: 0, examples: [22] }
        target:
          description: Organization target, in minutes.
          type: integer
          minimum: 1
          examples: [30]

    ReportResolution:
      description: |
        Median hours, with one decimal, from creation to the first time a ticket entered `resolved`, over the
        tickets created in the period that were resolved; `null` when there are none.
      type: object
      additionalProperties: false
      required: [value, previous]
      properties:
        value: { type: [number, 'null'], minimum: 0, examples: [6.5] }
        previous: { type: [number, 'null'], minimum: 0, examples: [null] }

    ReportDay:
      type: object
      additionalProperties: false
      required: [date, created, resolved]
      properties:
        date:
          description: Calendar day in the organization time zone.
          type: string
          format: date
          examples: ['2026-09-28']
        created:
          description: Tickets created that day.
          type: integer
          minimum: 0
          examples: [6]
        resolved:
          description: |
            Distinct tickets that entered `resolved` that day. A ticket resolved, reopened and resolved again on
            different days counts on each of them, so the days can add up to more than `resolved.value`.
          type: integer
          minimum: 0
          examples: [5]

    ReportChannel:
      type: object
      additionalProperties: false
      required: [channel, created, share]
      properties:
        channel: { $ref: '#/components/schemas/TicketChannel' }
        created:
          description: Tickets created in the period through this channel.
          type: integer
          minimum: 1
          examples: [30]
        share:
          description: Percentage of the tickets created in the period, one decimal.
          type: number
          minimum: 0
          maximum: 100
          examples: [71.4]

    ReportAgent:
      type: object
      additionalProperties: false
      required: [member, status, resolved, firstResponseMinutes, openAssigned]
      properties:
        member: { $ref: '#/components/schemas/MemberRef' }
        status:
          description: Membership status. Anything other than `active` is someone who left but worked in the period.
          allOf:
            - $ref: '#/components/schemas/MemberStatus'
        resolved:
          description: Distinct tickets this member moved to `resolved` in the period (the actor of the activity).
          type: integer
          minimum: 0
          examples: [20]
        firstResponseMinutes:
          description: |
            Median first response of the tickets created in the period whose first public message is theirs;
            `null` without data.
          type: [integer, 'null']
          minimum: 0
          examples: [15]
        openAssigned:
          description: Tickets assigned to this member that are not `resolved`, as of now.
          type: integer
          minimum: 0
          examples: [4]

    ArticleStatus:
      description: '`draft` is only visible to staff; `published` follows the article visibility.'
      type: string
      enum: [draft, published]
    ArticleVisibility:
      description: '`internal`: only staff, even when published. `public`: customers too, once published.'
      type: string
      enum: [internal, public]

    CategoryRef:
      description: A category as shown inside an article.
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }

    Category:
      type: object
      additionalProperties: false
      required: [id, name, slug, description, articles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        slug: { type: string, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 160 }
        articles:
          description: Articles of the category that the caller can read.
          type: integer
          minimum: 0

    CategoryCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], maxLength: 160 }

    ArticleSummary:
      description: An article in lists, without its body.
      type: object
      additionalProperties: false
      required: [id, slug, title, category, status, visibility, updatedAt, publishedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 160 }
        category: { $ref: '#/components/schemas/CategoryRef' }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        visibility: { $ref: '#/components/schemas/ArticleVisibility' }
        updatedAt: { type: string, format: date-time }
        publishedAt:
          description: When the article was last published; null while it is a draft.
          type: [string, 'null']
          format: date-time

    Article:
      description: |
        An article with its Markdown body: every field of ArticleSummary plus `body`, `allowFeedback`, `version`,
        `createdBy` and `updatedBy`. It is written out in full instead of composing ArticleSummary with `allOf`
        (see the contract modelling notes in README.md). The body is plain Markdown text: the API neither renders
        nor sanitizes it, so clients must never insert it as HTML.
      type: object
      additionalProperties: false
      required:
        [
          id,
          slug,
          title,
          category,
          status,
          visibility,
          updatedAt,
          publishedAt,
          body,
          allowFeedback,
          version,
          createdBy,
          updatedBy,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 160 }
        category: { $ref: '#/components/schemas/CategoryRef' }
        status: { $ref: '#/components/schemas/ArticleStatus' }
        visibility: { $ref: '#/components/schemas/ArticleVisibility' }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        body: { type: string, maxLength: 20000 }
        allowFeedback:
          description: Whether readers may rate the article (the ratings themselves are not part of this API yet).
          type: boolean
        version: { type: integer, format: int64, minimum: 0 }
        createdBy: { $ref: '#/components/schemas/MemberRef' }
        updatedBy: { $ref: '#/components/schemas/MemberRef' }

    ArticleCreate:
      type: object
      additionalProperties: false
      required: [title, body, categoryId, visibility]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        categoryId: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/ArticleVisibility' }
        allowFeedback: { type: boolean, default: true }

    ArticlePatch:
      description: Same fields as ArticleCreate, all optional. No field accepts `null`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        categoryId: { type: string, format: uuid }
        visibility: { $ref: '#/components/schemas/ArticleVisibility' }
        allowFeedback: { type: boolean }

    ArticlePage:
      description: An empty page past the last one is valid (200 with no items); `totalPages` is 0 when there are no items.
      type: object
      additionalProperties: false
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArticleSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    Problem:
      description: RFC 9457 Problem Details. An absent `type` means `about:blank`, as the RFC defines.
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          description: Field errors of a validation failure.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
